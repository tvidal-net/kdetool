[package]
name = "kwintool"
version = "0.1.0"
edition = "2024"
description = "Focus-or-start and arrange KDE Plasma windows from the command line"
authors = ["Thiago Oliveira Vidal <thiago@tvidal.uk>"]
license = "MIT"
repository = "https://github.com/tvidal-net/kwintool"
readme = "README.md"
keywords = ["kde", "kwin", "wayland", "window", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dbus = "0.9.12"
dbus-crossroads = "0.5.3"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
which = "8.0.4"
