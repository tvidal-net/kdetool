# kwintool window rules
#
# Translated from the arch DesktopManager KWin script. Install as
# ~/.config/kwintool.cfg (or ~/.kwintool.cfg), or point --config at it.
#
# Matching:
#   class      regex on the window resource class
#   title      regex on the window caption
# Actions:
#   to-desktop 1-based desktop number (KDE numbering); -1 = all desktops
#   to-screen  regex on the output name
#   geometry   mini-language: wNNN hNNN xNNN yNNN (optional %), v / m to maximise
#
# Not translated (no equivalent yet): no-border, keep-below and explicit
# un-maximise (maximize=false), so the original DIYLC rule is dropped and the
# JetBrains/mpv rules keep only their supported actions.

rules = [

  # Browsers: centred band, ~2/3 of the width, vertically maximised.
  { label = browsers-vertical
    class = "google-chrome|brave-browser|firefox"
    geometry = "x17%w67%v" }

  # Media / chat apps live on desktop 1.
  { label = media-to-desktop-1
    class = "brave-browser|spotify|rambox"
    to-desktop = 1 }

  # Chrome lives on desktop 2.
  { label = chrome-to-desktop-2
    class = "google-chrome"
    to-desktop = 2 }

  # JetBrains / Fleet: same centred band. The original also matched an empty
  # caption via the composite "^:jetbrains-"; here title matches the caption
  # only, so in practice the "-fleet$" alternative is what applies.
  { label = jetbrains-fleet
    class = "^jetbrains-"
    title = "-fleet$|^:jetbrains-"
    geometry = "x17%w67%v" }

  # Spotify / Rambox floating window.
  { label = spotify-rambox-float
    class = "spotify|rambox"
    geometry = "x826y274w1547h1084" }

  # GVim floating window.
  { label = gvim-float
    class = "gvim"
    geometry = "x1850y49w1283h1647" }

  # mpv camera grid: position each stream by caption.
  { label = mpv-door,   class = "mpv", title = "door",   geometry = "x0y192" }
  { label = mpv-ipcam1, class = "mpv", title = "ipcam1", geometry = "x640y352" }
  { label = mpv-ipcam2, class = "mpv", title = "ipcam2", geometry = "x640y672" }
  { label = mpv-ipcam3, class = "mpv", title = "ipcam3", geometry = "x0y672" }
  { label = mpv-ipcam4, class = "mpv", title = "ipcam4", geometry = "x640y0" }

  # Any mpv window: send it to the DP output, on all desktops.
  { label = mpv-other-screen
    class = "mpv"
    to-screen = "DP"
    to-desktop = -1 }
]
